<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login / Signup -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <h1>My AI Chatbot</h1>
      <p id="auth-sub">Log in to continue</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <div id="auth-error" class="error"></div>
      <button id="auth-btn">Log in</button>
      <a href="#" id="auth-toggle">No account? Sign up</a>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <button id="new-chat" class="primary">+ New chat</button>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <span id="user-email"></span>
        <div>
          <button id="theme-btn" class="ghost" title="Toggle theme">🌓</button>
          <button id="logout-btn" class="ghost">Logout</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="messages" class="messages">
        <div class="empty">Start a new chat and ask me anything.</div>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Type your message… (Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send-btn" class="primary">Send</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
